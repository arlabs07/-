
<!doctype html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<meta name="theme-color" content="#050505">
<title>Documentation | ARhub Ecosystem</title>
<meta name="description" content="Technical documentation for ARhub, PurplePDF, and ArDev. Featuring MDN Web Docs standards.">
<link rel="icon" type="image/x-icon" href="https://arlabs07.netlify.app/images/index/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Libraries: Prism (Code), KaTeX (Math) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<!-- ARhub Core Styles -->
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/docs.css">

<style>*,::after,::before{box-sizing:border-box;margin:0;padding:0}body,html{width:100%;height:100%;overflow-x:hidden;background-color:#050505;font-family:Outfit,sans-serif;color:#fff;}</style>
</head>
<body>

<!-- Header -->
<header class="header">
<div class="header-inner">
<a href="index.html" class="logo">
<img src="https://arlabs07.netlify.app/images/index/web-app-manifest-192x192.png" alt="ARhub Logo" width="32" height="32">
ARhub
</a>
<nav class="nav-links">
<a href="index.html">Home</a>
<a href="docs.html" class="active">Docs</a>
<a href="app.html">Systems</a>
<a href="blog.html">Blog</a>
</nav>
<div class="header-actions">
<button class="menu-toggle"><i class="fas fa-bars"></i></button>
</div>
</div>
</header>

<div class="docs-layout">
    
    <!-- Left Sidebar: Navigation -->
    <aside class="docs-sidebar" id="docs-sidebar">
        <div class="ds-header">
            <h3><i class="fas fa-book-open"></i> Documentation</h3>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="doc-search" placeholder="Search docs..." autocomplete="off">
            </div>
        </div>
        
        <div class="ds-nav" id="ds-nav">
            <!-- Injected via JS -->
            <div class="loading-docs">Loading structure...</div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="docs-main">
        <button id="mobile-doc-nav-toggle"><i class="fas fa-list"></i> Menu</button>
        
        <!-- Sticky TOC Bar (Injected via JS if headers exist) -->
        <div class="sticky-doc-bar" id="sticky-doc-bar" style="display:none;">
            <div class="sdb-current" id="sdb-current">Introduction</div>
            <button class="sdb-toggle" id="sdb-toggle"><i class="fas fa-chevron-down"></i></button>
            <div class="sdb-dropdown" id="sdb-list">
                <!-- JS Injected -->
            </div>
        </div>

        <div class="docs-content-wrapper" id="docs-render-area">
            <!-- Content Injected via JS -->
            <div style="padding: 50px; text-align: center; color: #666;">
                <i class="fas fa-circle-notch fa-spin fa-2x"></i>
                <p style="margin-top: 10px;">Loading documentation...</p>
            </div>
        </div>
        
        <div class="docs-footer-nav">
            <button id="prev-doc" class="nav-btn disabled"><i class="fas fa-arrow-left"></i> Previous</button>
            <button id="next-doc" class="nav-btn disabled">Next <i class="fas fa-arrow-right"></i></button>
        </div>
    </main>

    <!-- Right Sidebar: On This Page (Desktop Only) -->
    <aside class="docs-toc">
        <h4>On This Page</h4>
        <ul id="page-toc">
            <!-- Generated from Headers -->
        </ul>
    </aside>

</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- KaTeX for Math -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- Mermaid for Diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

<script src="js/sitemap.js"></script>
<script src="js/header.js"></script>
<script src="js/docs.js"></script>
</body>
</html>
