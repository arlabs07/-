<style>*,::after,::before{box-sizing:border-box;margin:0;padding:0}body,html{width:100%;height:100%;overflow-x:hidden;background-color:#050505;font-family:Outfit,sans-serif;color:#fff;scroll-behavior:smooth}::selection{background:rgba(255,140,0,.3);color:#fff}.theme-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:hidden;background:#050505}

/* --- RATING PAGE STYLES --- */

.rating-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 50px;
    padding-bottom: 60px;
}

/* FORM SECTION */
.feedback-form-card {
    background: rgba(20, 20, 20, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    height: fit-content;
    position: relative;
}

.form-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 20px;
    color: #fff;
    text-align: center;
}

/* Star Rating Widget */
.star-widget {
    display: flex;
    justify-content: center;
    flex-direction: row-reverse; /* For CSS hover magic */
    gap: 10px;
    margin-bottom: 25px;
}

.star-widget input { display: none; }

.star-widget label {
    font-size: 2rem;
    color: #444;
    cursor: pointer;
    transition: all 0.2s ease;
}

.star-widget label:hover,
.star-widget label:hover ~ label,
.star-widget input:checked ~ label {
    color: #ffb700;
    transform: scale(1.1);
}

/* Inputs */
.input-group { margin-bottom: 15px; }

.f-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 15px;
    border-radius: 8px;
    color: #fff;
    font-family: inherit;
    transition: border-color 0.3s;
}
.f-input:focus { outline: none; border-color: #ffb700; background: rgba(255, 183, 0, 0.05); }

.btn-submit {
    width: 100%;
    padding: 14px;
    background: #fff;
    color: #000;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.btn-submit:hover { background: #ffb700; transform: translateY(-2px); }
.btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

/* REVIEWS LIST SECTION */
.reviews-section {
    display: flex;
    flex-direction: column;
}

.reviews-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-height: 200px;
}

/* Loading State */
.loading-reviews {
    text-align: center;
    padding: 40px;
    color: #888;
    font-style: italic;
}

.review-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 20px;
    animation: fadeIn 0.5s ease-out;
    transition: transform 0.2s;
}
.review-card:hover {
    background: rgba(255,255,255,0.03);
    border-color: rgba(255,255,255,0.1);
}

.r-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
}

.r-user {
    display: flex;
    align-items: center;
    gap: 12px;
}

.r-avatar {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #333, #111);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: #888;
    border: 1px solid rgba(255,255,255,0.1);
    text-transform: uppercase;
}

.r-name { font-weight: 700; color: #fff; font-size: 0.95rem; }
.r-date { font-size: 0.75rem; color: #666; font-family: 'JetBrains Mono', monospace; }

.r-stars { color: #ffb700; font-size: 0.85rem; }

.r-message {
    color: #ccc;
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 15px;
    background: rgba(0,0,0,0.2);
    padding: 15px;
    border-radius: 8px;
    white-space: pre-wrap; /* Preserve newlines */
}

/* TEAM RESPONSE BOX */
.team-response {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.05);
    display: flex;
    gap: 12px;
}

.team-icon {
    color: #00c8ff;
    font-size: 1.2rem;
    margin-top: 2px;
}

.team-content h4 {
    font-size: 0.8rem;
    color: #00c8ff;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.team-text {
    font-size: 0.9rem;
    color: #888;
    font-style: italic;
}

.status-badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    margin-top: 5px;
}
.status-badge.pending { 
    background: rgba(255, 165, 0, 0.1); 
    color: orange; 
    border: 1px solid rgba(255, 165, 0, 0.3); 
}
.status-badge.replied {
    background: rgba(0, 200, 255, 0.1);
    color: #00c8ff;
    border: 1px solid rgba(0, 200, 255, 0.3);
}

/* Load More Button */
.load-more-container {
    margin-top: 30px;
    display: flex;
    justify-content: center;
}

.btn-load-more {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    padding: 10px 25px;
    border-radius: 50px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
}
.btn-load-more:hover {
    background: rgba(255,255,255,0.1);
    border-color: #fff;
}
.btn-load-more.hidden { display: none; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (min-width: 900px) {
    .rating-container {
        grid-template-columns: 1fr 1.5fr;
        align-items: start;
    }
    .feedback-form-card {
        position: sticky;
        top: 120px;
    }
}
</style>

<!-- RATING LOGIC -->
<script>
// IIFE to avoid global namespace pollution
(function() {

    // --- 1. CONFIGURATION (OBFUSCATED) ---
    // Decodes base64 strings to prevent direct scraping
    const _d = (s) => atob(s);
    
    const ENDPOINT_ENC = "aHR0cHM6Ly9qZnlpYnlyeGJzZHN3ZXJ4dGZrai5zdXBhYmFzZS5jby9mdW5jdGlvbnMvdjEvc2VydmVyLWFwaQ==";
    const KEY_ENC = "MzFhZmVhMTYxZmZmNTZjYjlmM2VjYzkyMTAyYjcwNDc4ZGU2MTY1YmQzNzE3MzQzNzg2YWM1YjUxZmM0NWFjMw==";
    
    const PARQRA_API = _d(ENDPOINT_ENC);
    const PARQRA_KEY = _d(KEY_ENC);

    // Limit Configuration
    const MAX_REVIEWS_PER_PERSON = 3;
    const LOCAL_STORAGE_KEY = 'arhub_user_reviews_v1';

    // --- 2. DB CLASS ---
    class ReviewDB {
        constructor(tableName) {
            this.table = tableName;
        }

        get headers() {
            return { 
                'Content-Type': 'application/json', 
                'x-api-key': PARQRA_KEY 
            };
        }

        async list() {
            try {
                const res = await fetch(`${PARQRA_API}/db/${this.table}`, { headers: this.headers });
                if(!res.ok) throw new Error("Network error");
                return res.json();
            } catch (e) {
                return { data: [] }; // Fail safe
            }
        }

        async create(payload) {
            const res = await fetch(`${PARQRA_API}/db/${this.table}`, {
                method: 'POST',
                headers: this.headers,
                body: JSON.stringify({ data: payload }) 
            });
            if (!res.ok) throw new Error("Submission failed. API Error.");
            return res.json();
        }
    }

    const db = new ReviewDB('Reviews');
    
    // --- 3. DOM & STATE ---
    const form = document.getElementById('ratingForm');
    const container = document.getElementById('reviews-container');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const submitBtn = document.querySelector('.btn-submit');
    
    let allReviews = [];
    let visibleCount = 0;
    const BATCH_SIZE = 5;

    // --- 4. FUNCTIONS ---

    async function fetchReviews() {
        if (!container) return;
        
        container.innerHTML = '<div class="loading-reviews"><i class="fas fa-circle-notch fa-spin"></i> Loading feedback...</div>';
        
        try {
            const response = await db.list();
            
            // JSON PARSING FIX:
            // The API returns rows, where the actual content is inside a nested 'data' property
            // We need to map this correctly.
            let rawRows = [];
            
            if (response && response.data && Array.isArray(response.data)) {
                rawRows = response.data;
            } else if (Array.isArray(response)) {
                rawRows = response;
            }

            // Flatten structure
            allReviews = rawRows.map(row => {
                // Check if row has nested 'data' object (Supabase/Parqra structure)
                const content = row.data || {}; 
                return {
                    username: content.username || "Anonymous",
                    rating: content.rating || 0,
                    feedback: content.feedback || "",
                    response: content.response || "Waiting for review",
                    date: content.date || row.created_at // Prefer payload date, fallback to DB date
                };
            });

            // Filter out empty/invalid
            allReviews = allReviews.filter(r => r.feedback !== "");

            // Sort by Date (Newest first)
            allReviews.sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = '';

            if (allReviews.length === 0) {
                container.innerHTML = '<div class="loading-reviews">No reviews yet. Be the first!</div>';
                if(loadMoreBtn) loadMoreBtn.style.display = 'none';
            } else {
                showNextBatch();
            }

        } catch (err) {
            container.innerHTML = '<div class="loading-reviews" style="color:#ff5f56">Unable to load reviews at this time.</div>';
        }
    }

    function showNextBatch() {
        const nextBatch = allReviews.slice(visibleCount, visibleCount + BATCH_SIZE);
        
        nextBatch.forEach(review => {
            container.appendChild(createReviewCard(review));
        });

        visibleCount += nextBatch.length;
        
        if (loadMoreBtn) {
            loadMoreBtn.style.display = (visibleCount >= allReviews.length) ? 'none' : 'block';
        }
    }

    function createReviewCard(review) {
        const div = document.createElement('div');
        div.className = 'review-card';

        const stars = parseInt(review.rating);
        let starHtml = '';
        for(let i=1; i<=5; i++) starHtml += (i<=stars) ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';

        const reply = review.response || "Waiting for review";
        const badgeClass = reply === "Waiting for review" ? "pending" : "replied";
        const badgeText = reply === "Waiting for review" ? "Pending" : "Official Response";

        // Safe HTML rendering
        div.innerHTML = `
            <div class="r-header">
                <div class="r-user">
                    <div class="r-avatar">${review.username.substring(0,2)}</div>
                    <div>
                        <div class="r-name">${escapeHtml(review.username)}</div>
                        <div class="r-date">${new Date(review.date).toLocaleDateString()}</div>
                    </div>
                </div>
                <div class="r-stars">${starHtml}</div>
            </div>
            <div class="r-message">${escapeHtml(review.feedback)}</div>
            <div class="team-response">
                <i class="fas fa-reply team-icon"></i>
                <div class="team-content">
                    <h4>Status</h4>
                    <div class="status-badge ${badgeClass}">${badgeText}</div>
                    <div class="team-text" style="margin-top:5px;">${escapeHtml(reply)}</div>
                </div>
            </div>
        `;
        return div;
    }

    function escapeHtml(text) {
        if(!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- 5. SUBMISSION HANDLER ---

    if(form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const feedback = document.getElementById('message').value.trim();
            const starsInput = document.querySelector('input[name="rate"]:checked');

            if (!starsInput) {
                alert("Please select a star rating.");
                return;
            }
            if (!username || !feedback) {
                alert("Please fill in all fields.");
                return;
            }

            // --- RATE LIMIT CHECK ---
            
            // 1. Local Storage Check
            let localCount = parseInt(localStorage.getItem(LOCAL_STORAGE_KEY) || '0');
            if (localCount >= MAX_REVIEWS_PER_PERSON) {
                alert("You have reached the maximum limit of 3 reviews.");
                return;
            }

            // 2. Username Check (Client-side scan of loaded reviews)
            const userReviewCount = allReviews.filter(r => r.username.toLowerCase() === username.toLowerCase()).length;
            if (userReviewCount >= MAX_REVIEWS_PER_PERSON) {
                alert(`The username '${username}' has already posted 3 reviews.`);
                return;
            }

            // Prepare Data
            const rating = parseInt(starsInput.value);
            const payload = {
                username: username,
                feedback: feedback,
                rating: rating,
                date: new Date().toISOString(),
                response: "Waiting for review"
            };

            // Loading UI
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';
            submitBtn.disabled = true;

            try {
                await db.create(payload);

                // Increment Local Counter
                localStorage.setItem(LOCAL_STORAGE_KEY, localCount + 1);

                // Add to UI immediately (top of list)
                const newCard = createReviewCard(payload);
                newCard.style.animation = "fadeIn 0.5s";
                
                // Clear "No reviews" message if present
                if(container.querySelector('.loading-reviews')) container.innerHTML = '';
                
                container.prepend(newCard);
                
                // Update internal list
                allReviews.unshift(payload);

                form.reset();
                alert("Review submitted!");

            } catch (err) {
                alert("Failed to submit review. Please try again later.");
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });
    }

    // Initialize
    fetchReviews();

    // Load More Listener
    if(loadMoreBtn) {
        loadMoreBtn.addEventListener('click', showNextBatch);
    }

})();
</script>
