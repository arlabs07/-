<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>AnimeX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="s.css">
</head>
<body>

<!-- BOTTOM NAV flat -->
<nav id="bn">
  <div id="bn-inner">
    <div class="bni" data-pg="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Search</span>
    </div>
    <div class="bni-home" id="bni-home-btn">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </div>
    <div class="bni" data-pg="profile">
      <i class="fa-solid fa-circle-user"></i>
      <span>Account</span>
    </div>
  </div>
</nav>

<!-- APP -->
<div id="app">
  <div class="pg act" id="page-home"></div>
  <div class="pg" id="page-search"></div>
  <div class="pg" id="page-profile"></div>

  <!-- See All overlay -->
  <div id="sao"></div>
  <!-- Show detail overlay -->
  <div id="sdo"></div>
  <!-- Episode player overlay -->
  <div id="evo"></div>
</div>

<div id="toast"></div>

<script src="d.js"></script>
<script src="p.js"></script>
<script src="Nova.js"></script>
<script src="r.js"></script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
