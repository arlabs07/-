<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>AnimeX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="s.css">
</head>
<body>

<!-- BOTTOM NAV -->
<nav id="bn">
  <svg id="bn-svg" preserveAspectRatio="none" viewBox="0 0 375 68" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="nav-grad" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- bump cutout shape -->
    <path d="M0,0 L148,0 Q158,0 162,8 Q168,22 187.5,22 Q207,22 213,8 Q217,0 227,0 L375,0 L375,68 L0,68 Z"
          fill="rgba(5,5,5,0.97)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <!-- gradient sheen on bump -->
    <path d="M148,0 Q158,0 162,8 Q168,22 187.5,22 Q207,22 213,8 Q217,0 227,0"
          fill="none" stroke="url(#nav-grad)" stroke-width="1"/>
  </svg>
  <div id="bn-inner">
    <div class="bni" data-pg="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Search</span>
    </div>
    <div style="flex:1;position:relative;">
      <div class="bni-home" id="bni-home-btn">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </div>
    </div>
    <div class="bni" data-pg="profile">
      <i class="fa-solid fa-circle-user"></i>
      <span>Account</span>
    </div>
  </div>
</nav>

<!-- APP -->
<div id="app">
  <div class="pg act" id="page-home"></div>
  <div class="pg" id="page-search"></div>
  <div class="pg" id="page-profile"></div>

  <!-- See All overlay -->
  <div id="sao"></div>
  <!-- Show detail overlay -->
  <div id="sdo"></div>
  <!-- Episode player overlay -->
  <div id="evo"></div>
</div>

<div id="toast"></div>

<script src="d.js"></script>
<script src="p.js"></script>
<script src="nova.js"></script>
<script src="r.js"></script>
</body>
</html>
