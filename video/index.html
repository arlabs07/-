<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Nova Player</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;
  --surface:rgba(12,12,20,0.94);
  --glass:rgba(255,255,255,0.07);
  --glass-border:rgba(255,255,255,0.11);
  --accent:#6ee7f7;
  --accent2:#a78bfa;
  --text:#f0f0f8;
  --text-dim:rgba(240,240,248,0.55);
  --red:#f87171;
  --seek-h:4px;
  --seek-h-hover:6px;
  --radius:16px;
  --radius-sm:10px;
  --transition:cubic-bezier(0.4,0,0.2,1);
  --font:'SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{
  width:100%;min-height:100%;
  background:var(--bg);font-family:var(--font);color:var(--text);
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}

/* ── PAGE WRAPPER ── */
#np-page{
  width:100%;max-width:480px;
  display:flex;flex-direction:column;
  align-items:stretch;
  padding:16px 0 32px;
}

/* ── VIDEO TITLE ── */
#np-page-title{
  font-size:clamp(14px,3.5vw,18px);font-weight:700;
  letter-spacing:-.02em;color:var(--text);
  padding:0 16px 10px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  text-shadow:none;
}

/* ── PLAYER ROOT (9:16 container) ── */
#np-root{
  position:relative;width:100%;
  aspect-ratio:9/16;
  background:#000;overflow:hidden;user-select:none;
  contain:layout style;
  border-radius:var(--radius);
  box-shadow:0 8px 40px rgba(0,0,0,.6);
}
/* In fullscreen, override aspect ratio to fill viewport */
#np-root.fullscreen{
  position:fixed;inset:0;width:100%;height:100%;
  aspect-ratio:unset;border-radius:0;z-index:9999;
}

/* ── VIDEO ── */
#np-video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;background:#000;
  will-change:transform;
  image-rendering:auto;
  -webkit-transform:translateZ(0);transform:translateZ(0);
}

/* ── THUMBNAIL ── */
#np-thumb{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:1;pointer-events:none;
}

/* ── OVERLAY ── */
#np-overlay{position:absolute;inset:0;z-index:2;cursor:pointer;}
#np-overlay::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.88) 0%,transparent 40%,transparent 62%,rgba(0,0,0,.55) 100%);
  opacity:0;transition:opacity .3s var(--transition);pointer-events:none;
}
#np-controls.visible~#np-overlay::before,
#np-overlay:has(~#np-controls.visible)::before{opacity:1}

/* ── SPINNER ── */
#np-spinner{
  position:absolute;top:50%;left:50%;z-index:10;
  width:44px;height:44px;margin:-22px;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);border-radius:50%;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#np-spinner.show{opacity:1;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOP BAR ── */
#np-top-bar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  padding:14px 14px 6px;
  display:flex;align-items:center;justify-content:flex-end;
  opacity:0;transform:translateY(-6px);
  transition:opacity .28s var(--transition),transform .28s var(--transition);
  pointer-events:none;
}
#np-top-bar.visible{opacity:1;transform:none;pointer-events:auto}

/* ── CONTROLS BAR ── */
#np-controls{
  position:absolute;bottom:0;left:0;right:0;z-index:20;
  padding:0 12px 14px;
  display:flex;flex-direction:column;gap:2px;
  opacity:0;transform:translateY(6px);
  transition:opacity .28s var(--transition),transform .28s var(--transition);
  pointer-events:none;
}
#np-controls.visible{opacity:1;transform:none;pointer-events:auto}

/* ── SEEK BAR ── */
#np-seek-wrap{padding:8px 0 4px;cursor:pointer;touch-action:none}
#np-seek-track{
  position:relative;height:var(--seek-h);background:rgba(255,255,255,.18);
  border-radius:99px;overflow:visible;
  transition:height .2s var(--transition);
}
#np-seek-wrap:hover #np-seek-track,
#np-seek-wrap:active #np-seek-track{height:var(--seek-h-hover)}
#np-seek-buf{position:absolute;inset:0;width:0;height:100%;background:rgba(255,255,255,.28);border-radius:99px;pointer-events:none;}
#np-seek-fill{
  position:absolute;inset:0;width:0;height:100%;
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  border-radius:99px;pointer-events:none;
  box-shadow:0 0 8px rgba(110,231,247,.5);
}
#np-seek-thumb{
  position:absolute;top:50%;left:0;
  width:14px;height:14px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 3px rgba(110,231,247,.4);
  transform:translate(-50%,-50%) scale(0);
  transition:transform .2s var(--transition);pointer-events:none;
}
#np-seek-wrap:hover #np-seek-thumb,
#np-seek-wrap:active #np-seek-thumb{transform:translate(-50%,-50%) scale(1)}
#np-seek-hover{
  position:absolute;bottom:calc(100% + 12px);
  background:rgba(0,0,0,.85);backdrop-filter:blur(8px);color:#fff;
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;
  pointer-events:none;opacity:0;transform:translateX(-50%);
  white-space:nowrap;transition:opacity .15s;
  border:1px solid var(--glass-border);
}

/* ── BUTTON ROW ── */
#np-btn-row{
  display:flex;align-items:center;gap:2px;
}
#np-time{font-size:11px;font-weight:500;color:var(--text-dim);white-space:nowrap;margin:0 4px;flex-shrink:0;}
#np-btn-row-right{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0;}

/* ── ICON BUTTONS ── */
.np-btn{
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;border:none;
  background:transparent;color:var(--text);cursor:pointer;
  transition:background .18s,color .18s,transform .12s;
  flex-shrink:0;position:relative;
}
.np-btn:hover{background:var(--glass);color:#fff}
.np-btn:active{transform:scale(.88)}
.np-btn svg{width:20px;height:20px;display:block;pointer-events:none}
.np-btn.active{color:var(--accent)}
#np-play{background:rgba(255,255,255,.13);width:44px;height:44px;border-radius:50%;}
#np-play:hover{background:rgba(255,255,255,.22)}
#np-play svg{width:26px;height:26px}
.np-btn-label{
  display:flex;align-items:center;gap:4px;
  padding:0 10px;border-radius:99px;height:34px;
  font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.02em;
}
.np-btn-label svg{width:15px;height:15px;flex-shrink:0}

/* ── VOLUME ── */
#np-vol-wrap{display:flex;align-items:center;gap:4px}
#np-vol-slider-wrap{width:0;overflow:hidden;transition:width .25s var(--transition);}
#np-vol-wrap:hover #np-vol-slider-wrap,
#np-vol-wrap:focus-within #np-vol-slider-wrap{width:60px}
#np-vol-track{
  position:relative;height:4px;background:rgba(255,255,255,.2);
  border-radius:99px;cursor:pointer;width:60px;margin-right:6px;
}
#np-vol-fill{position:absolute;inset:0;width:100%;height:100%;background:var(--accent);border-radius:99px;pointer-events:none;}
input[type=range]#np-vol-slider{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;}

/* ── MENUS (scrollable, max height) ── */
.np-menu{
  position:absolute;bottom:calc(100% + 8px);
  background:var(--surface);backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid var(--glass-border);border-radius:var(--radius-sm);
  padding:4px;min-width:130px;
  max-height:min(240px, 45vh);
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  opacity:0;transform:translateY(8px) scale(.96);
  pointer-events:none;
  transition:opacity .2s var(--transition),transform .2s var(--transition);
  z-index:30;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.15) transparent;
}
.np-menu::-webkit-scrollbar{width:3px}
.np-menu::-webkit-scrollbar-track{background:transparent}
.np-menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px}
.np-menu.open{opacity:1;transform:none;pointer-events:auto}
#np-speed-menu{right:0}
#np-lang-menu{right:0}
.np-menu-item{
  display:flex;align-items:center;gap:6px;
  width:100%;padding:9px 12px;border:none;border-radius:6px;
  background:transparent;color:var(--text-dim);
  font-size:13px;font-weight:500;cursor:pointer;text-align:left;
  transition:background .15s,color .15s;white-space:nowrap;
}
.np-menu-item:hover{background:var(--glass);color:var(--text)}
.np-menu-item.active{color:var(--accent)}
.np-menu-item svg{width:13px;height:13px;flex-shrink:0;color:var(--accent)}

/* ── PLAYLIST PANEL (side drawer, inside np-root) ── */
#np-pl-panel{
  position:absolute;right:0;top:0;bottom:0;width:min(260px,80%);z-index:40;
  background:rgba(8,8,16,.97);backdrop-filter:blur(24px);
  border-left:1px solid var(--glass-border);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .3s var(--transition);
  overflow:hidden;
}
#np-pl-panel.open{transform:none}
#np-pl-header{
  padding:14px 14px 10px;font-size:11px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);
  border-bottom:1px solid var(--glass-border);flex-shrink:0;
}
#np-pl-list{
  list-style:none;overflow-y:auto;flex:1;padding:4px 0;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
}
#np-pl-list::-webkit-scrollbar{width:3px}
#np-pl-list::-webkit-scrollbar-track{background:transparent}
#np-pl-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px}
.np-pl-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;cursor:pointer;
  transition:background .15s;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.np-pl-item:hover,.np-pl-item:active{background:var(--glass)}
.np-pl-item.active{background:rgba(110,231,247,.08)}
.np-pl-item.active .np-pl-name{color:var(--accent)}
.np-pl-thumb-wrap{flex-shrink:0;width:58px;height:34px;border-radius:5px;overflow:hidden;background:#1a1a2e}
.np-pl-thumb{width:100%;height:100%;object-fit:cover}
.np-pl-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.np-pl-num{font-size:9px;font-weight:800;color:var(--text-dim);letter-spacing:.06em}
.np-pl-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── NUDGE ── */
#np-nudge,#np-nudge-left,#np-nudge-right{
  position:absolute;top:42%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
  border:1px solid var(--glass-border);
  color:#fff;font-size:14px;font-weight:700;
  padding:7px 16px;border-radius:99px;
  opacity:0;pointer-events:none;z-index:15;
  white-space:nowrap;
}
#np-nudge{left:50%}
#np-nudge-left{left:25%}
#np-nudge-right{left:75%}
#np-nudge.show,#np-nudge-left.show,#np-nudge-right.show{animation:nudgePop .7s var(--transition) forwards}
@keyframes nudgePop{0%{opacity:1;transform:translate(-50%,-50%) scale(.88)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}100%{opacity:0;transform:translate(-50%,-55%) scale(1)}}

/* ── 2× SPEED BADGE ── */
#np-speed-hold{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.78);backdrop-filter:blur(12px);
  border:1px solid var(--accent);color:var(--accent);
  font-size:15px;font-weight:900;letter-spacing:.04em;
  padding:5px 14px;border-radius:99px;
  opacity:0;pointer-events:none;z-index:15;
  transition:opacity .2s;
}
#np-speed-hold.show{opacity:1}

/* ── FOCUS VISIBLE ── */
.np-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.np-menu-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ── FULLSCREEN overrides ── */
#np-root.fullscreen #np-controls{padding:0 16px 20px}
#np-root.fullscreen #np-top-bar{padding:18px 18px 8px}

/* ── RESPONSIVE ── */
@media(max-width:400px){
  #np-page{padding:10px 0 24px}
  #np-page-title{font-size:14px;padding:0 12px 8px}
  .np-btn{width:34px;height:34px}
  .np-btn svg{width:18px;height:18px}
  #np-play{width:40px;height:40px}
  #np-play svg{width:22px;height:22px}
  #np-time{font-size:10px;margin:0 2px}
  .np-btn-label{padding:0 8px;font-size:10px;height:30px}
}
@media(max-width:340px){
  #np-time{display:none}
}

/* ── DESKTOP: center & constrain ── */
@media(min-width:600px){
  #np-page{max-width:420px;padding:32px 0 48px}
  #np-page-title{font-size:17px}
}
</style>
</head>
<body>
<div id="np-page">

  <!-- Video title above player -->
  <div id="np-page-title">Loading…</div>

  <!-- Player container: 9:16 -->
  <div id="np-root" role="region" aria-label="Nova Video Player">

    <video id="np-video" preload="metadata" playsinline webkit-playsinline
      aria-label="Video player" title="Video"></video>

    <img id="np-thumb" alt="Video thumbnail" draggable="false"/>

    <div id="np-spinner" role="status" aria-label="Loading"></div>

    <!-- 2× hold badge -->
    <div id="np-speed-hold" aria-live="polite">2×</div>

    <!-- Nudge feedback -->
    <div id="np-nudge" aria-live="assertive" aria-atomic="true"></div>
    <div id="np-nudge-left" aria-live="assertive" aria-atomic="true"></div>
    <div id="np-nudge-right" aria-live="assertive" aria-atomic="true"></div>

    <!-- TOP BAR (right side: lang only) -->
    <div id="np-top-bar" role="banner">
      <div style="position:relative">
        <button id="np-lang" class="np-btn np-btn-label" aria-haspopup="true" aria-expanded="false" title="Change language (EN/HI/JA)">
          <!-- icon injected -->
        </button>
        <div id="np-lang-menu" class="np-menu" role="menu" aria-label="Language options"></div>
      </div>
    </div>

    <!-- OVERLAY -->
    <div id="np-overlay" role="presentation" aria-hidden="true"></div>

    <!-- CONTROLS -->
    <div id="np-controls" role="toolbar" aria-label="Video controls">

      <!-- SEEK -->
      <div id="np-seek-wrap" role="slider"
        aria-label="Video seek bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
        tabindex="0">
        <div id="np-seek-track">
          <div id="np-seek-buf"></div>
          <div id="np-seek-fill"></div>
          <div id="np-seek-thumb"></div>
          <div id="np-seek-hover"></div>
        </div>
      </div>

      <!-- BUTTON ROW -->
      <div id="np-btn-row">

        <!-- Prev / Play / Next -->
        <button id="np-prev" class="np-btn" title="Previous (P)" aria-label="Previous video"></button>
        <button id="np-play" class="np-btn" title="Play/Pause (Space)" aria-label="Play or pause"></button>
        <button id="np-next" class="np-btn" title="Next (N)" aria-label="Next video"></button>

        <!-- Volume -->
        <div id="np-vol-wrap">
          <button id="np-vol" class="np-btn" title="Mute (M)" aria-label="Toggle mute"></button>
          <div id="np-vol-slider-wrap">
            <div id="np-vol-track">
              <div id="np-vol-fill"></div>
              <input type="range" id="np-vol-slider" min="0" max="1" step="0.02" value="1"
                aria-label="Volume" title="Volume"/>
            </div>
          </div>
        </div>

        <span id="np-time" aria-live="off">0:00 / 0:00</span>

        <div id="np-btn-row-right">
          <!-- Speed -->
          <div style="position:relative">
            <button id="np-speed" class="np-btn np-btn-label" aria-haspopup="true" aria-expanded="false" title="Playback speed (< >)">
              <!-- icon + span injected -->
            </button>
            <div id="np-speed-menu" class="np-menu" role="menu" aria-label="Playback speed options"></div>
          </div>

          <!-- Playlist -->
          <button id="np-pl" class="np-btn" title="Playlist" aria-label="Toggle playlist" aria-expanded="false"></button>

          <!-- Fullscreen -->
          <button id="np-fs" class="np-btn" title="Fullscreen (F)" aria-label="Toggle fullscreen"></button>
        </div>
      </div>
    </div>

    <!-- PLAYLIST PANEL (inside root) -->
    <div id="np-pl-panel" role="complementary" aria-label="Playlist" aria-hidden="true">
      <div id="np-pl-header">Playlist</div>
      <ul id="np-pl-list" role="listbox" aria-label="Video playlist"></ul>
    </div>

  </div><!-- /np-root -->
</div><!-- /np-page -->
<script src="player.js"></script>
</body>
</html>
